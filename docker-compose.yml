services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4890:4890"
    environment:
      PORT: "4890"
      CLIENT_ORIGIN: "http://localhost:4891"
      DATA_DIR: "/data"
    volumes:
      # Persistent SQLite database
      - auspex-data:/data
      # SSH agent forwarding for SSH-based Git clones
      - type: bind
        source: ${SSH_AUTH_SOCK:-/dev/null}
        target: /run/ssh-agent
        read_only: true
      # Read-only SSH config (keys are NEVER copied into the image)
      - type: bind
        source: ${HOME}/.ssh
        target: /root/.ssh
        read_only: true
    environment:
      SSH_AUTH_SOCK: /run/ssh-agent
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4891:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  auspex-data:
    driver: local
