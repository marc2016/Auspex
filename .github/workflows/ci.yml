name: CI - Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Compile Extension & Webview
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auspex-vsix
          path: '*.vsix'
          retention-days: 14
