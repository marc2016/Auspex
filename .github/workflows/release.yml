name: Create Release & Package VSIX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (z. B. v0.2.0, leer lassen um Version aus package.json zu nehmen)'
        required: false
        default: ''
        type: string
      publish_to_marketplace:
        description: 'Auch direkt in den VS Code Marketplace publishen (benötigt VSCE_PAT Secret)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build, Package & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

      - name: Compile Extension & Webview
        run: npm run build

      - name: Package VSIX
        run: npx @vscode/vsce package --no-git-tag-version

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            TAG="v${PKG_VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target release tag: $TAG"

      - name: Upload VSIX as Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auspex-${{ steps.release_info.outputs.tag }}-vsix
          path: '*.vsix'
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          files: '*.vsix'
          generate_release_notes: true

      - name: Publish to VS Code Marketplace (optional)
        if: ${{ inputs.publish_to_marketplace && env.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
